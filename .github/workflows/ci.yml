name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Tesseract (OCR français)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-fra
      - name: Dépendances
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build de l'image
        run: docker build -t factur-ia .
      - name: Smoke test de l'API
        run: |
          docker run -d -p 8000:8000 --name api factur-ia
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 1; done
          curl -sf http://localhost:8000/health
